<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="hinGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="50%" stop-color="#1E5208" />
      <stop offset="100%" stop-color="#113304" />
    </linearGradient>
    <linearGradient id="hinGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3D45F" />
      <stop offset="100%" stop-color="#7CB342" />
    </linearGradient>
  </defs>

  <!-- Outer Shield -->
  <rect x="3" y="3" width="42" height="42" rx="10" fill="url(#hinGreenGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <!-- Left Vertical Pillar of the 'H' -->
  <rect x="10" y="11" width="6.5" height="26" rx="2" fill="#FFFFFF" />

  <!-- Right Vertical Pillar of the 'H' -->
  <rect x="31.5" y="11" width="6.5" height="26" rx="2" fill="#FFFFFF" />

  <!-- Central Connecting Bar -->
  <rect x="14" y="21" width="20" height="6" rx="1.5" fill="#FFFFFF" />

  <!-- Central Community Node -->
  <circle cx="24" cy="24" r="4.5" fill="url(#hinGoldGrad)" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="24" cy="24" r="1.8" fill="#1E5208" />

  <!-- Upward Growth Chevrons -->
  <path d="M10 11L13.25 8L16.5 11" stroke="url(#hinGoldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M31.5 11L34.75 8L38 11" stroke="url(#hinGoldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
